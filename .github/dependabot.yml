# Keeps the SHA-pinned actions current. Pinning by commit SHA is what stops an
# action's code changing with no diff here (CLAUDE.md, "CI shape"), but a SHA never
# moves on its own: without this, security fixes in checkout, setup-terraform or
# trivy-action would stop arriving and nobody would notice. Dependabot proposes the
# new SHA and rewrites the trailing `# vX.Y.Z` comment in the same PR.
#
# GitHub Actions only. Terraform providers are pinned by the committed lockfiles
# and bumped deliberately, alongside a plan — not on a weekly schedule.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
