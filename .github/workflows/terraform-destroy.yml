name: terraform-destroy

# Manual, controlled teardown: you pick the environment and layer when you run it.
# Destructive — gated by a typed confirmation and, for PROD, by the `prod` GitHub
# Environment (required reviewer). Shares the `terraform-<env>` concurrency group
# with terraform-deploy so a destroy can never overlap an apply for the same env.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options: [hml, prod]
      layer:
        description: "Which layer(s) to destroy"
        required: true
        default: both
        type: choice
        options: [foundation, workload, both]
      confirm:
        description: "Type the environment name (hml/prod) to confirm destroy"
        required: true
        type: string

permissions:
  contents: read
  id-token: write # OIDC

jobs:
  destroy:
    runs-on: ubuntu-latest
    # Ties to the GitHub Environment: `prod` carries the required reviewer, so a
    # prod run pauses for approval before this job starts.
    environment: ${{ github.event.inputs.environment }}
    concurrency:
      group: terraform-${{ github.event.inputs.environment }}
      cancel-in-progress: false
    env:
      ENVIRONMENT: ${{ github.event.inputs.environment }}
    steps:
      - name: Confirm destroy
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "$ENVIRONMENT" ]; then
            echo "Confirmation '${{ github.event.inputs.confirm }}' does not match environment '$ENVIRONMENT'. Aborting." >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3

      # Assumes the write-capable DEPLOY role — same gate as terraform-deploy: the
      # `environment:` declaration above is what mints the subject claim this role
      # trusts, and the Environment's branch policy gates the job itself.
      - name: Select AWS role
        run: |
          if [ "$ENVIRONMENT" = "prod" ]; then
            echo "AWS_ROLE_ARN=${{ secrets.PROD_DEPLOY_ROLE_ARN }}" >> "$GITHUB_ENV"
          else
            echo "AWS_ROLE_ARN=${{ secrets.HML_DEPLOY_ROLE_ARN }}" >> "$GITHUB_ENV"
          fi

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b # v6.2.0
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "~> 1.10"

      - name: Resolve layers
        run: |
          # LAYERS gates which steps run; the workload-before-foundation ordering is
          # the order of the steps themselves, not the order of this string. They
          # were separated so the VPC preflight can sit between them — see there.
          if [ "${{ github.event.inputs.layer }}" = "both" ]; then
            echo "LAYERS=workload foundation" >> "$GITHUB_ENV"
          else
            echo "LAYERS=${{ github.event.inputs.layer }}" >> "$GITHUB_ENV"
          fi

      # What the cluster still owns at teardown, and what it no longer does.
      #
      # The ingress load balancer used to be created by a controller reacting to a
      # Gateway in Git. It never entered Terraform state, so `terraform destroy`
      # did not know it existed; its ENIs held the private subnets and the subnets
      # held the VPC. Four consecutive runs failed that way on 2026-08-24, and two
      # attempts to script around it both aimed at an object another controller
      # owned — Applications whose children carried no finalizer, then a Service
      # that istiod recreates from its Gateway.
      #
      # That is gone. `workload/modules/platform-ingress` declares the load
      # balancer, and the cluster only attaches to it through a TargetGroupBinding,
      # so the edge tears down in dependency order with nothing scripting it
      # (ARCHITECTURE.md §3). The Service deletion, the k8s-* wait loop and the
      # security-group sweep were removed here after run 33406865986 destroyed a
      # live ingress path cleanly with all three finding nothing to do.
      #
      # What remains has nothing to do with load balancers:
      #
      #   1. Freeze automation. selfHeal restores whatever the teardown deletes.
      #   2. Strip finalizers. An Application waiting on one blocks the Helm
      #      uninstall — a destroy hung five minutes that way and failed with
      #      "context deadline exceeded".
      #
      # Karpenter will add a third when its NodePools exist: its instances are EC2
      # outside Terraform state, and their ENIs hold subnets. Same class of
      # problem, but draining a NodePool is deterministic polling rather than a bet
      # on how an operator sequences its own deletion.
      - name: Drain cluster-owned state
        if: contains(env.LAYERS, 'workload')
        run: |
          set -uo pipefail
          CLUSTER=$(terraform -chdir=foundation init -input=false \
            -backend-config="environments/${ENVIRONMENT}/backend.hcl" >/dev/null 2>&1 \
            && terraform -chdir=foundation output -raw cluster_name 2>/dev/null || true)

          # An absent cluster is success, not an error worth swallowing with
          # continue-on-error. That flag used to cover this case and a drain that
          # failed to converge equally, which meant a real failure reached
          # `terraform destroy` disguised as a skip.
          # A cluster name is alphanumerics, hyphens and underscores. Anything else
          # is not a name: `terraform output -raw` prints "Warning: No outputs
          # found" and exits 0 when the state has none, so the warning text lands
          # here and would otherwise be passed to the AWS CLI as an identifier.
          case "$CLUSTER" in
            ""|*[!a-zA-Z0-9_-]*) CLUSTER="" ;;
          esac

          if [ -z "$CLUSTER" ] || ! aws eks describe-cluster --name "$CLUSTER" >/dev/null 2>&1; then
            echo "no live cluster for '$ENVIRONMENT'; nothing to drain"
            exit 0
          fi

          aws eks update-kubeconfig --region us-east-1 --name "$CLUSTER"

          # Freeze first, delete second.
          #
          # Every Application sets selfHeal: true, so deleting a resource Argo CD
          # manages is an instruction to recreate it. Clearing syncPolicy.automated
          # is the correct instrument — NOT scaling argocd-application-controller to
          # zero, which is the obvious move and the wrong one: the same controller
          # processes finalizers, so a deletion afterwards hangs forever.
          echo "::group::freezing Argo CD automation"
          for APP in $(kubectl get applications -n argocd -o name 2>/dev/null); do
            kubectl patch "$APP" -n argocd --type merge \
              -p '{"spec":{"syncPolicy":{"automated":null}}}' || true
          done
          echo "::endgroup::"

          # Karpenter first, while its controller is still running.
          #
          # Deleting a NodePool asks Karpenter to cordon, drain and terminate the
          # nodes it created. Only Karpenter can do that, so this has to happen
          # before the Application that installs Karpenter is deleted below — an
          # earlier version ran inside `Destroy foundation`, three steps later, by
          # which point the controller was gone and two nodes were left running with
          # their NodeClaims stuck.
          #
          # Same principle the rest of this step follows: delete what owns AWS
          # resources while the thing that owns it is alive.
          echo "::group::deleting Karpenter NodePools"

          # The CRD gates the NodePool delete and nothing else.
          #
          # It used to gate the instance sweep below as well, which put the recovery
          # path behind the thing that fails in a recovery. A destroy that stopped
          # partway has already had its Applications deleted, so Karpenter's chart is
          # gone and its CRDs with it — the check then reports "nothing to drain" and
          # the orphaned instances it exists to catch are never touched. Observed in
          # run 33901410299: the step succeeded and i-0ff9a43642a09206e, tagged
          # karpenter.sh/nodepool, stayed running and blocked the subnet.
          #
          # Deleting a NodePool needs the CRD. Terminating an orphaned instance does
          # not, and the tags that identify one outlive every Kubernetes object.
          if kubectl get crd nodepools.karpenter.sh >/dev/null 2>&1; then
            kubectl delete nodepools --all --timeout=10m || true
          else
            echo "  no Karpenter CRDs"
          fi
          echo "::endgroup::"

          echo "::group::deleting Argo CD Applications"
          kubectl delete applications --all -n argocd --timeout=5m || true
          echo "::endgroup::"

          # Anything still holding a finalizer would block the Helm uninstall of the
          # bootstrap release during `terraform destroy workload`.
          REMAINING=$(kubectl get applications -n argocd -o name 2>/dev/null || true)
          if [ -n "$REMAINING" ]; then
            echo "::group::stripping finalizers from Applications that did not go"
            for APP in $REMAINING; do
              echo "  $APP"
              kubectl patch "$APP" -n argocd --type merge \
                -p '{"metadata":{"finalizers":null}}' || true
            done
            kubectl delete applications --all -n argocd --timeout=2m || true
            echo "::endgroup::"
          fi

      # Deliberately its own step, and deliberately not gated on a live cluster.
      #
      # The step above needs one: freezing Argo CD, deleting Applications and
      # deleting NodePools are all Kubernetes operations. This is not. An instance
      # Karpenter launched is identified by AWS tags that outlive every Kubernetes
      # object, and the case that matters most is precisely the one where the
      # cluster is already gone.
      #
      # Folding it into the drain put it behind `no live cluster; nothing to drain`,
      # so a destroy that had already removed the EKS control plane skipped the
      # cleanup entirely and failed twenty minutes later on a subnet an orphaned
      # instance was holding (runs 33901410299 and 33903367132).
      #
      # In the normal path Karpenter has just been asked to drain its nodes and is
      # still running, so the poll below simply waits and finds nothing to do.
      - name: Terminate Karpenter instances
        if: contains(env.LAYERS, 'foundation')
        run: |
          set -uo pipefail
          # Scoped by VPC, not by cluster name.
          #
          # cluster_name is an output of the EKS cluster resource, so it disappears
          # from state the moment that resource is destroyed — which in a recovery
          # run has already happened. Keying the filter on it put this step behind
          # the same kind of guard it was written to get past: run 33906148952
          # printed "no cluster name in state" and skipped, while the instance it
          # exists to remove was running.
          #
          # vpc_id survives, because the VPC is what is still failing to delete. And
          # scoping to the VPC is what "this environment" actually means here.
          VPC=$(terraform -chdir=foundation init -input=false \
            -backend-config="environments/${ENVIRONMENT}/backend.hcl" >/dev/null 2>&1 \
            && terraform -chdir=foundation output -raw vpc_id 2>/dev/null || true)
          case "$VPC" in
            vpc-*) echo "looking in $VPC" ;;
            *) echo "no vpc_id in state; nothing left to look in"; exit 0 ;;
          esac

          # Termination is asynchronous; poll rather than trust the delete to have
          # finished the work it started.
          # karpenter.sh/nodepool is what makes this safe: Karpenter writes it to
          # every instance it launches and to nothing else, so the bastion and the
          # managed node group are out of reach even though they share the VPC.
          KARPENTER_FILTERS="--filters Name=tag:karpenter.sh/nodepool,Values=* Name=vpc-id,Values=$VPC Name=instance-state-name,Values=pending,running,stopping,stopped"

          IDS=""
          for i in $(seq 1 20); do
          # shellcheck disable=SC2086
          IDS=$(aws ec2 describe-instances $KARPENTER_FILTERS \
                --query "Reservations[].Instances[].InstanceId" --output text) || {
            echo "  could not list instances; aborting rather than guessing" >&2
            exit 1
          }
          [ -z "$IDS" ] && { [ "$i" = "1" ] && echo "  no Karpenter instances" || echo "  no Karpenter instances left"; break; }
          echo "  waiting on: $IDS"
          sleep 15
          done

          # Karpenter is the right thing to terminate its own nodes, and it is not
          # the only thing that can. If instances survive the wait — or if there was
          # never a controller to ask — terminate them here.
          #
          # The targets are named by two tags, so this cannot reach the bastion or
          # the system pool even though both sit in the same VPC.
          if [ -n "$IDS" ]; then
          echo "  Karpenter did not terminate these; doing it directly: $IDS"
          # shellcheck disable=SC2086
          aws ec2 terminate-instances --instance-ids $IDS >/dev/null || {
            echo "  could not terminate $IDS" >&2
            exit 1
          }
          # shellcheck disable=SC2086
          aws ec2 wait instance-terminated --instance-ids $IDS || {
            echo "  instances did not reach terminated state" >&2
            exit 1
          }
          echo "  terminated"
          fi
          echo "::endgroup::"


      # Destroyed before foundation: this layer depends on foundation's state and on
      # a live cluster endpoint. It is also what removes the platform ALB, which is
      # why the preflight below runs after it rather than before.
      - name: Destroy workload
        if: contains(env.LAYERS, 'workload')
        run: |
          set -euo pipefail
          terraform -chdir=workload init -input=false \
            -backend-config="environments/${ENVIRONMENT}/backend.hcl"
          terraform -chdir=workload destroy -auto-approve -input=false \
            -var-file="environments/${ENVIRONMENT}/terraform.tfvars"

      # Fail here, in seconds, rather than inside `terraform destroy` forty minutes
      # later as an opaque DependencyViolation.
      #
      # Placed BETWEEN the two layers, not before them. The platform ALB is owned by
      # Terraform and is destroyed with the workload layer, so running this first
      # would flag the very resource that is about to be removed correctly. By this
      # point the only load balancer left in the VPC is one nothing is going to
      # remove.
      #
      # Queried by VpcId, not by a k8s-* name prefix: a load balancer with a
      # customised name was invisible to the old check, and classic load balancers
      # were never counted at all.
      - name: Preflight — the VPC holds nothing Terraform does not own
        if: contains(env.LAYERS, 'foundation')
        run: |
          set -uo pipefail
          CLUSTER=$(terraform -chdir=foundation init -input=false \
            -backend-config="environments/${ENVIRONMENT}/backend.hcl" >/dev/null 2>&1 \
            && terraform -chdir=foundation output -raw cluster_name 2>/dev/null || true)
          # Same shape check as the drain: an empty state makes `output -raw` print a
          # warning and exit 0, and that text is not a cluster name.
          case "$CLUSTER" in
            ""|*[!a-zA-Z0-9_-]*) CLUSTER="" ;;
          esac
          [ -n "$CLUSTER" ] || { echo "no cluster in state; nothing to check"; exit 0; }

          VPC=$(aws eks describe-cluster --name "$CLUSTER" \
                --query 'cluster.resourcesVpcConfig.vpcId' --output text 2>/dev/null || true)
          case "$VPC" in
            vpc-*) ;;
            *) echo "no live VPC; nothing to check"; exit 0 ;;
          esac

          echo "checking VPC $VPC"
          FAIL=0

          # Terraform owns the platform ALB and destroys it itself, so anything here
          # at this point is a load balancer nothing is going to remove.
          LBS=$(aws elbv2 describe-load-balancers \
                --query "LoadBalancers[?VpcId=='$VPC'].LoadBalancerName" --output text) || FAIL=1
          CLBS=$(aws elb describe-load-balancers \
                 --query "LoadBalancerDescriptions[?VPCId=='$VPC'].LoadBalancerName" --output text) || FAIL=1
          if [ -n "$LBS$CLBS" ]; then
            echo "  BLOCKING load balancers: $LBS $CLBS" >&2
            FAIL=1
          fi

          # Security groups nobody is going to delete.
          #
          # Three owners are excluded, because each of them removes its own on the
          # way out: the VPC's default group, anything tagged ManagedBy=terraform
          # (every group in this repository, through var.tags), and anything tagged
          # aws:eks:cluster-name — the group EKS creates for the cluster and deletes
          # when the cluster goes.
          #
          # That last exclusion is not a weakening. This step runs before
          # `Destroy foundation`, so the cluster is still alive and its group is
          # supposed to be here; flagging it blocked a teardown that had nothing
          # wrong with it. The run where such a group really did strand the VPC had
          # a different shape — the cluster was already gone, and the group survived
          # only because an orphaned CNI interface still sat in it. That is an
          # interface problem, handled by the sweep in `Destroy foundation`, and the
          # group follows it out.
          #
          # What is left after the three exclusions is a group with no owner at all,
          # which is the thing worth stopping for.
          SGS=$(aws ec2 describe-security-groups --filters "Name=vpc-id,Values=$VPC" \
                --query "SecurityGroups[?GroupName!='default' && !(Tags[?Key=='ManagedBy' && Value=='terraform']) && !(Tags[?Key=='aws:eks:cluster-name'])].[GroupId,GroupName]" \
                --output text) || {
            echo "  could not list security groups in $VPC" >&2
            FAIL=1
          }
          if [ -n "$SGS" ]; then
            echo "  BLOCKING security groups Terraform does not own:" >&2
            echo "$SGS" | sed 's/^/    /' >&2
            FAIL=1
          fi

          # Unattached ENIs hold a subnet exactly as an attached one does — but only
          # the ones nothing is going to remove.
          #
          # Interfaces tagged eks:eni:owner=amazon-vpc-cni are excluded, because the
          # sweep in `Destroy foundation` polls for exactly those and deletes them.
          # Including them here blocked a healthy teardown: the drain step had just
          # terminated two Karpenter nodes, their interfaces were still being
          # released, and this check — which looks once, unlike the sweep — caught
          # one mid-flight. The interface was gone on its own minutes later.
          #
          # Release lags termination. The sweep polls for that reason; this does not,
          # so it must not judge the interfaces the sweep owns.
          ENIS=$(aws ec2 describe-network-interfaces \
                 --filters "Name=vpc-id,Values=$VPC" "Name=status,Values=available" \
                 --query "NetworkInterfaces[?!(Tags[?Key=='eks:eni:owner' && Value=='amazon-vpc-cni'])].NetworkInterfaceId" \
                 --output text) || FAIL=1
          if [ -n "$ENIS" ]; then
            echo "  BLOCKING unattached ENIs: $ENIS" >&2
            FAIL=1
          fi

          if [ "$FAIL" = "1" ]; then
            echo >&2
            echo "The VPC holds resources Terraform does not manage. Destroying now would" >&2
            echo "fail on DependencyViolation after tearing most of the platform down." >&2
            echo >&2
            echo "If you selected layer=foundation while the workload layer is still" >&2
            echo "deployed, the platform ALB above is Terraform-owned and this is telling" >&2
            echo "you to destroy workload first — run with layer=both." >&2
            exit 1
          fi
          echo "  clean"

      # Destroyed in two passes, with an ENI sweep between them.
      #
      # The VPC CNI attaches secondary ENIs to each node to hand pods their IPs.
      # When the node terminates those can be left behind in `available` state, and
      # an unattached ENI holds a subnet exactly as an attached one does. Observed
      # in run 33414534333: `eni-02a725bd07ff1cdc2  available  aws-K8S-i-0274c8...`
      # blocked the private 1a subnet through twenty minutes of provider retries
      # while the identical 1b subnet, which happened to have none, deleted in one
      # second.
      #
      # It cannot be caught before Terraform runs. The ENI is in use while the node
      # is alive, so the preflight correctly reports it as nothing; it only becomes
      # an orphan once the node group is gone, which happens inside this step. So
      # the node group is destroyed first, on its own, and the sweep runs in the
      # window that opens — after the ENIs are released and before anything needs
      # the subnet to be empty.
      #
      # `-target` is used deliberately here. It is discouraged for applies, where it
      # hides drift, but this is teardown ordering, which is the one thing it
      # expresses well and which this workflow already does between layers.
      - name: Destroy foundation
        if: contains(env.LAYERS, 'foundation')
        run: |
          set -euo pipefail
          terraform -chdir=foundation init -input=false \
            -backend-config="environments/${ENVIRONMENT}/backend.hcl"

          # Read before the -target destroy below: that one leaves the outputs
          # partially stale, and this value has to be the live VPC.
          #
          # The shape is checked, not just the exit status. `terraform output -raw`
          # prints "Warning: No outputs found" and exits 0 when the state has no
          # outputs left, so the warning text itself lands in the variable. That is
          # what happened in run 33419007931: the id became a paragraph of prose,
          # the AWS call built from it failed, the failure was swallowed, and the
          # sweep announced "none orphaned" while an orphaned interface sat in the
          # VPC holding a subnet. Anything that is not a vpc- id is treated as no
          # id at all.
          VPC=$(terraform -chdir=foundation output -raw vpc_id 2>/dev/null || true)
          case "$VPC" in
            vpc-*) echo "vpc from foundation outputs: $VPC" ;;
            *)     VPC=""; echo "no vpc_id in foundation outputs" ;;
          esac

          echo "::group::terraform destroy — node group first"
          terraform -chdir=foundation destroy -auto-approve -input=false \
            -target=module.eks_managed-node-group \
            -var-file="environments/${ENVIRONMENT}/terraform.tfvars"
          echo "::endgroup::"

          # Sweep what the nodes left behind.
          #
          # Selected by the CNI's own tag, `eks:eni:owner=amazon-vpc-cni`, which is
          # what actually records who created the interface. The first version of
          # this matched `aws-K8S-` on the description and reported "none orphaned"
          # in run 33419007931 while exactly such an interface sat in the VPC — and
          # because that query silenced stderr and fell back to an empty result, a
          # failed call and an empty VPC were indistinguishable. Both are fixed
          # here: the tag is a filter the API applies, and an error is now loud.
          #
          # Release lags termination, so this polls rather than looking once.
          # No VPC means the foundation layer is already gone, which is a normal
          # state to destroy from — there is nothing to sweep and nothing to fail
          # about. A VPC that exists but blocks is still reported by the destroy
          # itself, with the dependency named.
          if [ -z "$VPC" ]; then
            echo "nothing deployed to sweep"
          else

          echo "::group::sweeping orphaned VPC CNI network interfaces in $VPC"
          EMPTY=0
          for i in $(seq 1 12); do
            ENIS=$(aws ec2 describe-network-interfaces \
                   --filters "Name=vpc-id,Values=$VPC" \
                             "Name=status,Values=available" \
                             "Name=tag:eks:eni:owner,Values=amazon-vpc-cni" \
                   --query "NetworkInterfaces[].NetworkInterfaceId" --output text) || {
              echo "  could not list network interfaces in $VPC" >&2
              exit 1
            }
            # Two consecutive empty passes, not one.
            #
            # Release lags termination, and this runs seconds after instances were
            # terminated — so the first look can legitimately find nothing while an
            # interface is still detaching. Breaking there is how a sweep reports
            # "none orphaned" and is wrong: run 33906645713 said it thirty seconds
            # after a node was terminated.
            if [ -z "$ENIS" ]; then
              EMPTY=$((EMPTY + 1))
              if [ "$EMPTY" -ge 2 ]; then
                echo "  none left"
                break
              fi
              sleep 15
              continue
            fi
            EMPTY=0
            for ENI in $ENIS; do
              echo "  deleting $ENI"
              # Not fatal on its own: an interface that refuses to go is reported by
              # the subnet delete, with the dependency named.
              aws ec2 delete-network-interface --network-interface-id "$ENI" || true
            done
            sleep 10
          done
          echo "::endgroup::"
          fi

          # The cluster next, on its own, for the same reason the node group was.
          #
          # EKS creates a security group for the cluster and deletes it with the
          # cluster — usually. When it lingers it holds the VPC, and the VPC is
          # destroyed in the same pass as the cluster, so there is no moment in
          # between for anything to notice. Observed in run 33906645713: the subnet
          # deleted cleanly and `eks-cluster-sg-eks-hml-cluster-571031308` sat in an
          # otherwise empty VPC through twenty minutes of retries.
          #
          # Same shape as the node group and its interfaces, one level up:
          #
          #   node group   →  CNI interfaces  →  hold the subnets
          #   cluster      →  cluster SG      →  holds the VPC
          #
          # Both need a window between "Terraform removed X" and "Terraform needs
          # what X's debris is holding".
          echo "::group::terraform destroy — cluster next"
          terraform -chdir=foundation destroy -auto-approve -input=false \
            -target=module.eks_cluster \
            -var-file="environments/${ENVIRONMENT}/terraform.tfvars"
          echo "::endgroup::"

          # Whatever EKS left behind.
          #
          # Selected the way the preflight selects: not the VPC's default group, and
          # not carrying the ManagedBy=terraform tag every group in this repository
          # gets through var.tags. Foundation's own groups are still alive at this
          # point and are excluded by that tag; with the cluster gone, what remains
          # in that category is by definition debris.
          #
          # Deletion can fail while something still references the group, so this
          # polls rather than trying once.
          if [ -n "$VPC" ]; then
            echo "::group::sweeping security groups EKS left behind"
            for i in $(seq 1 12); do
              SGS=$(aws ec2 describe-security-groups --filters "Name=vpc-id,Values=$VPC" \
                    --query "SecurityGroups[?GroupName!='default' && !(Tags[?Key=='ManagedBy' && Value=='terraform'])].GroupId" \
                    --output text) || {
                echo "  could not list security groups in $VPC" >&2
                exit 1
              }
              [ -z "$SGS" ] && { [ "$i" = "1" ] && echo "  none left behind" || echo "  none left"; break; }
              for SG in $SGS; do
                echo "  deleting $SG"
                # Not fatal on its own: a group that refuses to go is reported by the
                # VPC delete, with the dependency named.
                aws ec2 delete-security-group --group-id "$SG" || true
              done
              sleep 10
            done
            echo "::endgroup::"
          fi

          echo "::group::terraform destroy — the rest of foundation"
          terraform -chdir=foundation destroy -auto-approve -input=false \
            -var-file="environments/${ENVIRONMENT}/terraform.tfvars"
          echo "::endgroup::"
