name: terraform-destroy

# Manual, controlled teardown: you pick the environment and layer when you run it.
# Destructive — gated by a typed confirmation and, for PROD, by the `prod` GitHub
# Environment (required reviewer). Shares the `terraform-<env>` concurrency group
# with terraform-deploy so a destroy can never overlap an apply for the same env.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options: [hml, prod]
      layer:
        description: "Which layer(s) to destroy"
        required: true
        default: both
        type: choice
        options: [foundation, workload, both]
      confirm:
        description: "Type the environment name (hml/prod) to confirm destroy"
        required: true
        type: string

permissions:
  contents: read
  id-token: write # OIDC

jobs:
  destroy:
    runs-on: ubuntu-latest
    # Ties to the GitHub Environment: `prod` carries the required reviewer, so a
    # prod run pauses for approval before this job starts.
    environment: ${{ github.event.inputs.environment }}
    concurrency:
      group: terraform-${{ github.event.inputs.environment }}
      cancel-in-progress: false
    env:
      ENVIRONMENT: ${{ github.event.inputs.environment }}
    steps:
      - name: Confirm destroy
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "$ENVIRONMENT" ]; then
            echo "Confirmation '${{ github.event.inputs.confirm }}' does not match environment '$ENVIRONMENT'. Aborting." >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3

      # Assumes the write-capable DEPLOY role — same gate as terraform-deploy: the
      # `environment:` declaration above is what mints the subject claim this role
      # trusts, and the Environment's branch policy gates the job itself.
      - name: Select AWS role
        run: |
          if [ "$ENVIRONMENT" = "prod" ]; then
            echo "AWS_ROLE_ARN=${{ secrets.PROD_DEPLOY_ROLE_ARN }}" >> "$GITHUB_ENV"
          else
            echo "AWS_ROLE_ARN=${{ secrets.HML_DEPLOY_ROLE_ARN }}" >> "$GITHUB_ENV"
          fi

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b # v6.2.0
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "~> 1.10"

      - name: Resolve layers
        run: |
          # "both" must destroy workload BEFORE foundation (reverse of apply):
          # workload depends on foundation's state and on a live cluster endpoint.
          if [ "${{ github.event.inputs.layer }}" = "both" ]; then
            echo "LAYERS=workload foundation" >> "$GITHUB_ENV"
          else
            echo "LAYERS=${{ github.event.inputs.layer }}" >> "$GITHUB_ENV"
          fi

      # Kubernetes creates AWS resources that Terraform never sees: the ALB
      # controller makes a load balancer for every LoadBalancer Service, and the
      # VPC CNI makes security groups. Their controllers clean them up when the
      # objects are deleted — but only while those controllers are still running.
      # Destroy the cluster first and they are orphaned, and orphaned ENIs and
      # security groups hold the subnets and the VPC, failing the destroy.
      #
      # Observed, not theorised: a teardown left an NLB that blocked both private
      # subnets, and a second left two k8s-* security groups that blocked the VPC.
      #
      # So the cluster is emptied before Terraform touches anything. Deleting the
      # Argo CD Applications cascades (the root carries resources-finalizer),
      # which removes the Gateway, its Service, and with it the load balancer,
      # with every controller still alive to do its own cleanup.
      - name: Drain Kubernetes-owned AWS resources
        if: contains(env.LAYERS, 'workload')
        continue-on-error: true # a cluster that is already gone is not an error
        run: |
          set -uo pipefail
          CLUSTER=$(terraform -chdir=foundation init -input=false \
            -backend-config="environments/${ENVIRONMENT}/backend.hcl" >/dev/null 2>&1 \
            && terraform -chdir=foundation output -raw cluster_name 2>/dev/null || true)

          if [ -z "$CLUSTER" ] || ! aws eks describe-cluster --name "$CLUSTER" >/dev/null 2>&1; then
            echo "no live cluster; nothing to drain"
            exit 0
          fi

          aws eks update-kubeconfig --region us-east-1 --name "$CLUSTER"

          # Delete what creates AWS resources FIRST, and directly.
          #
          # Relying on Argo CD to cascade does not work here: only the root
          # Application carries resources-finalizer, so deleting every Application
          # at once removes the children with no finalizer of their own and orphans
          # everything they own — observed, with an NLB surviving a full ten-minute
          # wait while its Service was already gone.
          #
          # A LoadBalancer Service is the thing that maps to an NLB, so deleting it
          # is what makes the controller remove one. Targeting that directly needs
          # no assumption about how any operator sequences its own teardown.
          echo "::group::deleting LoadBalancer Services (what the controller maps to an NLB)"
          kubectl delete svc --all-namespaces --field-selector spec.type=LoadBalancer --timeout=5m || true
          echo "::endgroup::"

          # The controllers delete load balancers asynchronously. Wait rather than
          # race: a load balancer still draining leaves ENIs that block a subnet.
          echo "waiting for Kubernetes-created load balancers to go"
          for i in $(seq 1 40); do
            N=$(aws elbv2 describe-load-balancers \
                  --query "length(LoadBalancers[?starts_with(LoadBalancerName, 'k8s-')])" --output text 2>/dev/null || echo 0)
            [ "$N" = "0" ] && { echo "  none left"; break; }
            echo "  $N remaining"
            sleep 15
          done

          # Only now remove the Applications. Doing it after the Services means Argo
          # CD cannot recreate a Gateway — and its Service — through selfHeal while
          # the load balancer is still draining.
          echo "::group::deleting Argo CD Applications"
          kubectl delete applications --all -n argocd --timeout=5m || true
          echo "::endgroup::"

          # Security groups the CNI and the load-balancer controller created. They
          # outlive their controllers and hold the VPC; Terraform does not know them.
          VPC=$(aws eks describe-cluster --name "$CLUSTER" --query 'cluster.resourcesVpcConfig.vpcId' --output text 2>/dev/null || true)
          if [ -n "$VPC" ] && [ "$VPC" != "None" ]; then
            for SG in $(aws ec2 describe-security-groups --filters "Name=vpc-id,Values=$VPC" \
                         --query "SecurityGroups[?starts_with(GroupName, 'k8s-')].GroupId" --output text 2>/dev/null); do
              echo "  deleting security group $SG"
              aws ec2 delete-security-group --group-id "$SG" || true
            done
          fi

      - name: Destroy
        run: |
          set -euo pipefail
          for L in $LAYERS; do
            echo "::group::terraform destroy $L ($ENVIRONMENT)"
            terraform -chdir="$L" init -input=false \
              -backend-config="environments/${ENVIRONMENT}/backend.hcl"
            terraform -chdir="$L" destroy -auto-approve -input=false \
              -var-file="environments/${ENVIRONMENT}/terraform.tfvars"
            echo "::endgroup::"
          done
