name: terraform-destroy

# Manual, controlled teardown: you pick the environment and layer when you run it.
# Destructive — gated by a typed confirmation and, for PROD, by the `prod` GitHub
# Environment (required reviewer). Shares the `terraform-<env>` concurrency group
# with terraform-deploy so a destroy can never overlap an apply for the same env.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options: [hml, prod]
      layer:
        description: "Which layer(s) to destroy"
        required: true
        default: both
        type: choice
        options: [foundation, workload, both]
      confirm:
        description: "Type the environment name (hml/prod) to confirm destroy"
        required: true
        type: string

permissions:
  contents: read
  id-token: write # OIDC

jobs:
  destroy:
    runs-on: ubuntu-latest
    # Ties to the GitHub Environment: `prod` carries the required reviewer, so a
    # prod run pauses for approval before this job starts.
    environment: ${{ github.event.inputs.environment }}
    concurrency:
      group: terraform-${{ github.event.inputs.environment }}
      cancel-in-progress: false
    env:
      ENVIRONMENT: ${{ github.event.inputs.environment }}
    steps:
      - name: Confirm destroy
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "$ENVIRONMENT" ]; then
            echo "Confirmation '${{ github.event.inputs.confirm }}' does not match environment '$ENVIRONMENT'. Aborting." >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3

      # Assumes the write-capable DEPLOY role — same gate as terraform-deploy: the
      # `environment:` declaration above is what mints the subject claim this role
      # trusts, and the Environment's branch policy gates the job itself.
      - name: Select AWS role
        run: |
          if [ "$ENVIRONMENT" = "prod" ]; then
            echo "AWS_ROLE_ARN=${{ secrets.PROD_DEPLOY_ROLE_ARN }}" >> "$GITHUB_ENV"
          else
            echo "AWS_ROLE_ARN=${{ secrets.HML_DEPLOY_ROLE_ARN }}" >> "$GITHUB_ENV"
          fi

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b # v6.2.0
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "~> 1.10"

      - name: Resolve layers
        run: |
          # LAYERS gates which steps run; the workload-before-foundation ordering is
          # the order of the steps themselves, not the order of this string. They
          # were separated so the VPC preflight can sit between them — see there.
          if [ "${{ github.event.inputs.layer }}" = "both" ]; then
            echo "LAYERS=workload foundation" >> "$GITHUB_ENV"
          else
            echo "LAYERS=${{ github.event.inputs.layer }}" >> "$GITHUB_ENV"
          fi

      # What the cluster still owns at teardown, and what it no longer does.
      #
      # The ingress load balancer used to be created by a controller reacting to a
      # Gateway in Git. It never entered Terraform state, so `terraform destroy`
      # did not know it existed; its ENIs held the private subnets and the subnets
      # held the VPC. Four consecutive runs failed that way on 2026-08-24, and two
      # attempts to script around it both aimed at an object another controller
      # owned — Applications whose children carried no finalizer, then a Service
      # that istiod recreates from its Gateway.
      #
      # That is gone. `workload/modules/platform-ingress` declares the load
      # balancer, and the cluster only attaches to it through a TargetGroupBinding,
      # so the edge tears down in dependency order with nothing scripting it
      # (ARCHITECTURE.md §3). The Service deletion, the k8s-* wait loop and the
      # security-group sweep were removed here after run 33406865986 destroyed a
      # live ingress path cleanly with all three finding nothing to do.
      #
      # What remains has nothing to do with load balancers:
      #
      #   1. Freeze automation. selfHeal restores whatever the teardown deletes.
      #   2. Strip finalizers. An Application waiting on one blocks the Helm
      #      uninstall — a destroy hung five minutes that way and failed with
      #      "context deadline exceeded".
      #
      # Karpenter will add a third when its NodePools exist: its instances are EC2
      # outside Terraform state, and their ENIs hold subnets. Same class of
      # problem, but draining a NodePool is deterministic polling rather than a bet
      # on how an operator sequences its own deletion.
      - name: Drain cluster-owned state
        if: contains(env.LAYERS, 'workload')
        run: |
          set -uo pipefail
          CLUSTER=$(terraform -chdir=foundation init -input=false \
            -backend-config="environments/${ENVIRONMENT}/backend.hcl" >/dev/null 2>&1 \
            && terraform -chdir=foundation output -raw cluster_name 2>/dev/null || true)

          # An absent cluster is success, not an error worth swallowing with
          # continue-on-error. That flag used to cover this case and a drain that
          # failed to converge equally, which meant a real failure reached
          # `terraform destroy` disguised as a skip.
          if [ -z "$CLUSTER" ] || ! aws eks describe-cluster --name "$CLUSTER" >/dev/null 2>&1; then
            echo "no live cluster for '$ENVIRONMENT'; nothing to drain"
            exit 0
          fi

          aws eks update-kubeconfig --region us-east-1 --name "$CLUSTER"

          # Freeze first, delete second.
          #
          # Every Application sets selfHeal: true, so deleting a resource Argo CD
          # manages is an instruction to recreate it. Clearing syncPolicy.automated
          # is the correct instrument — NOT scaling argocd-application-controller to
          # zero, which is the obvious move and the wrong one: the same controller
          # processes finalizers, so a deletion afterwards hangs forever.
          echo "::group::freezing Argo CD automation"
          for APP in $(kubectl get applications -n argocd -o name 2>/dev/null); do
            kubectl patch "$APP" -n argocd --type merge \
              -p '{"spec":{"syncPolicy":{"automated":null}}}' || true
          done
          echo "::endgroup::"

          echo "::group::deleting Argo CD Applications"
          kubectl delete applications --all -n argocd --timeout=5m || true
          echo "::endgroup::"

          # Anything still holding a finalizer would block the Helm uninstall of the
          # bootstrap release during `terraform destroy workload`.
          REMAINING=$(kubectl get applications -n argocd -o name 2>/dev/null || true)
          if [ -n "$REMAINING" ]; then
            echo "::group::stripping finalizers from Applications that did not go"
            for APP in $REMAINING; do
              echo "  $APP"
              kubectl patch "$APP" -n argocd --type merge \
                -p '{"metadata":{"finalizers":null}}' || true
            done
            kubectl delete applications --all -n argocd --timeout=2m || true
            echo "::endgroup::"
          fi

      # Destroyed before foundation: this layer depends on foundation's state and on
      # a live cluster endpoint. It is also what removes the platform ALB, which is
      # why the preflight below runs after it rather than before.
      - name: Destroy workload
        if: contains(env.LAYERS, 'workload')
        run: |
          set -euo pipefail
          terraform -chdir=workload init -input=false \
            -backend-config="environments/${ENVIRONMENT}/backend.hcl"
          terraform -chdir=workload destroy -auto-approve -input=false \
            -var-file="environments/${ENVIRONMENT}/terraform.tfvars"

      # Fail here, in seconds, rather than inside `terraform destroy` forty minutes
      # later as an opaque DependencyViolation.
      #
      # Placed BETWEEN the two layers, not before them. The platform ALB is owned by
      # Terraform and is destroyed with the workload layer, so running this first
      # would flag the very resource that is about to be removed correctly. By this
      # point the only load balancer left in the VPC is one nothing is going to
      # remove.
      #
      # Queried by VpcId, not by a k8s-* name prefix: a load balancer with a
      # customised name was invisible to the old check, and classic load balancers
      # were never counted at all.
      - name: Preflight — the VPC holds nothing Terraform does not own
        if: contains(env.LAYERS, 'foundation')
        run: |
          set -uo pipefail
          CLUSTER=$(terraform -chdir=foundation init -input=false \
            -backend-config="environments/${ENVIRONMENT}/backend.hcl" >/dev/null 2>&1 \
            && terraform -chdir=foundation output -raw cluster_name 2>/dev/null || true)
          [ -n "$CLUSTER" ] || { echo "no cluster in state; nothing to check"; exit 0; }

          VPC=$(aws eks describe-cluster --name "$CLUSTER" \
                --query 'cluster.resourcesVpcConfig.vpcId' --output text 2>/dev/null || true)
          [ -n "$VPC" ] && [ "$VPC" != "None" ] || { echo "no live VPC; nothing to check"; exit 0; }

          echo "checking VPC $VPC"
          FAIL=0

          # Terraform owns the platform ALB and destroys it itself, so anything here
          # at this point is a load balancer nothing is going to remove.
          LBS=$(aws elbv2 describe-load-balancers \
                --query "LoadBalancers[?VpcId=='$VPC'].LoadBalancerName" --output text 2>/dev/null || true)
          CLBS=$(aws elb describe-load-balancers \
                 --query "LoadBalancerDescriptions[?VPCId=='$VPC'].LoadBalancerName" --output text 2>/dev/null || true)
          if [ -n "$LBS$CLBS" ]; then
            echo "  BLOCKING load balancers: $LBS $CLBS" >&2
            FAIL=1
          fi

          SGS=$(aws ec2 describe-security-groups --filters "Name=vpc-id,Values=$VPC" \
                --query "SecurityGroups[?starts_with(GroupName,'k8s-')].GroupId" --output text 2>/dev/null || true)
          if [ -n "$SGS" ]; then
            echo "  BLOCKING controller-created security groups: $SGS" >&2
            FAIL=1
          fi

          # Unattached ENIs hold a subnet exactly as an attached one does. This
          # catches one left over from an earlier run; it cannot catch one created
          # by a node that is still alive at this point, because the ENI is in use
          # and correctly invisible here. Those are swept in `Destroy foundation`,
          # after the node group is gone — see the comment there.
          ENIS=$(aws ec2 describe-network-interfaces \
                 --filters "Name=vpc-id,Values=$VPC" "Name=status,Values=available" \
                 --query "NetworkInterfaces[].NetworkInterfaceId" --output text 2>/dev/null || true)
          if [ -n "$ENIS" ]; then
            echo "  BLOCKING unattached ENIs: $ENIS" >&2
            FAIL=1
          fi

          if [ "$FAIL" = "1" ]; then
            echo >&2
            echo "The VPC holds resources Terraform does not manage. Destroying now would" >&2
            echo "fail on DependencyViolation after tearing most of the platform down." >&2
            echo >&2
            echo "If you selected layer=foundation while the workload layer is still" >&2
            echo "deployed, the platform ALB above is Terraform-owned and this is telling" >&2
            echo "you to destroy workload first — run with layer=both." >&2
            exit 1
          fi
          echo "  clean"

      # Destroyed in two passes, with an ENI sweep between them.
      #
      # The VPC CNI attaches secondary ENIs to each node to hand pods their IPs.
      # When the node terminates those can be left behind in `available` state, and
      # an unattached ENI holds a subnet exactly as an attached one does. Observed
      # in run 33414534333: `eni-02a725bd07ff1cdc2  available  aws-K8S-i-0274c8...`
      # blocked the private 1a subnet through twenty minutes of provider retries
      # while the identical 1b subnet, which happened to have none, deleted in one
      # second.
      #
      # It cannot be caught before Terraform runs. The ENI is in use while the node
      # is alive, so the preflight correctly reports it as nothing; it only becomes
      # an orphan once the node group is gone, which happens inside this step. So
      # the node group is destroyed first, on its own, and the sweep runs in the
      # window that opens — after the ENIs are released and before anything needs
      # the subnet to be empty.
      #
      # `-target` is used deliberately here. It is discouraged for applies, where it
      # hides drift, but this is teardown ordering, which is the one thing it
      # expresses well and which this workflow already does between layers.
      - name: Destroy foundation
        if: contains(env.LAYERS, 'foundation')
        run: |
          set -euo pipefail
          terraform -chdir=foundation init -input=false \
            -backend-config="environments/${ENVIRONMENT}/backend.hcl"

          VPC=$(terraform -chdir=foundation output -raw vpc_id 2>/dev/null || true)

          echo "::group::terraform destroy — node group first"
          terraform -chdir=foundation destroy -auto-approve -input=false \
            -target=module.eks_managed-node-group \
            -var-file="environments/${ENVIRONMENT}/terraform.tfvars"
          echo "::endgroup::"

          # Sweep what the nodes left behind. Scoped to the CNI's own naming
          # (`aws-K8S-*`) rather than every available ENI: the cluster's control
          # plane interfaces are also transiently unattached during teardown and
          # EKS removes those itself.
          #
          # Release lags termination, so this polls rather than looking once. It
          # never fails the job — if an ENI survives, the subnet delete reports it,
          # and a sweep that cannot delete something is not itself the problem.
          if [ -n "$VPC" ]; then
            echo "::group::sweeping orphaned VPC CNI network interfaces"
            for i in $(seq 1 12); do
              ENIS=$(aws ec2 describe-network-interfaces \
                     --filters "Name=vpc-id,Values=$VPC" "Name=status,Values=available" \
                     --query "NetworkInterfaces[?starts_with(Description, 'aws-K8S-')].NetworkInterfaceId" \
                     --output text 2>/dev/null || true)
              if [ -z "$ENIS" ]; then
                [ "$i" = "1" ] && echo "  none orphaned" || echo "  none left"
                break
              fi
              for ENI in $ENIS; do
                echo "  deleting $ENI"
                aws ec2 delete-network-interface --network-interface-id "$ENI" || true
              done
              sleep 10
            done
            echo "::endgroup::"
          fi

          echo "::group::terraform destroy — the rest of foundation"
          terraform -chdir=foundation destroy -auto-approve -input=false \
            -var-file="environments/${ENVIRONMENT}/terraform.tfvars"
          echo "::endgroup::"
