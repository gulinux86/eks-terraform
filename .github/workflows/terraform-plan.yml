name: terraform-plan

# Plan as read-only feedback:
#   - automatically on PRs to develop/main (env inferred from the base branch),
#     posted as a PR comment so you review the diff before deploying;
#   - on demand via workflow_dispatch, where you pick the environment.
# Deploys are separate and manual (see terraform-deploy.yml).
on:
  pull_request:
    branches: [master, develop, main]
    paths:
      - "**.tf"
      - "**.tfvars"
      - "**.hcl"
      - "**.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to plan"
        required: true
        type: choice
        options: [hml, prod]

permissions:
  contents: read
  id-token: write # OIDC
  pull-requests: write # post the plan comment (PR runs only)

concurrency:
  group: tf-plan-${{ github.event.pull_request.number || github.event.inputs.environment }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        layer: [foundation, workload]
    steps:
      - name: Checkout
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3

      # Manual dispatch → use the chosen environment. Pull requests always resolve
      # to hml: `master` is the single source of truth for deploys, so there is no
      # branch-per-environment mapping to infer from.
      #
      # Assumes the read-only PLAN role. This job runs on pull requests, whose
      # workflow file comes from the PR's own branch — it must never hold a
      # credential that can mutate AWS.
      - name: Select environment + role
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ENV="${{ github.event.inputs.environment }}"
          else
            ENV="hml"
          fi
          echo "ENV_NAME=$ENV" >> "$GITHUB_ENV"
          if [ "$ENV" = "prod" ]; then
            echo "AWS_ROLE_ARN=${{ secrets.PROD_PLAN_ROLE_ARN }}" >> "$GITHUB_ENV"
          else
            echo "AWS_ROLE_ARN=${{ secrets.HML_PLAN_ROLE_ARN }}" >> "$GITHUB_ENV"
          fi

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b # v6.2.0
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "~> 1.10"

      - name: Terraform fmt
        run: terraform fmt -check -recursive

      - name: Terraform init
        run: terraform -chdir=${{ matrix.layer }} init -backend-config=environments/${{ env.ENV_NAME }}/backend.hcl

      - name: Terraform validate
        run: terraform -chdir=${{ matrix.layer }} validate

      - name: Terraform plan
        id: plan
        run: |
          set +e

          # Greenfield/torn-down guard: the workload layer reads foundation's
          # remote state. Skip the workload plan when foundation has no outputs
          # for this env — either it was never applied, or it was destroyed (the
          # state object still exists but is empty). Checking outputs (not just
          # the object's existence) covers both cases.
          if [ "${{ matrix.layer }}" = "workload" ]; then
            HCL="foundation/environments/${ENV_NAME}/backend.hcl"
            BUCKET=$(sed -nE 's/^[[:space:]]*bucket[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' "$HCL")
            KEY=$(sed -nE 's/^[[:space:]]*key[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' "$HCL")
            STATE=$(aws s3 cp "s3://$BUCKET/$KEY" - 2>/dev/null || echo '{}')

            # Asks whether the outputs this layer actually reads are present, not
            # whether the count is non-zero.
            #
            # A count assumes outputs arrive and leave together, which a destroy that
            # fails partway does not honour: one left `vpc_cidr` behind, another left
            # two, and both times the guard passed and the plan failed with a page of
            # "Unsupported attribute" on a pull request that changed no Terraform at
            # all. Worse, it deadlocks — the destroy that would clear the state needs
            # a workflow fix, and the pull request carrying that fix cannot go green.
            #
            # The list is derived from workload/ the same way
            # scripts/check-layer-contract.sh derives it, so a new consumer needs no
            # change here.
            MISSING=""
            for NAME in $(grep -rhoE 'terraform_remote_state\.foundation\.outputs\.[a-zA-Z0-9_]+' \
                          --include='*.tf' workload \
                          | sed -E 's/.*\.outputs\.//' | sort -u); do
              printf '%s' "$STATE" | jq -e --arg n "$NAME" '.outputs[$n]' >/dev/null 2>&1 \
                || MISSING="$MISSING $NAME"
            done

            if [ -n "$MISSING" ]; then
              {
                echo "Skipped: the foundation layer does not currently publish everything"
                echo "the workload layer reads for '${ENV_NAME}'."
                echo
                echo "Missing outputs:$MISSING"
                echo
                echo "Foundation is either not applied yet, destroyed, or left partly"
                echo "destroyed by a failed run. Apply it (terraform-deploy → layer:"
                echo "foundation) and re-run, or finish the teardown so the state is empty."
              } > /tmp/plan_output.txt
              echo "skipped=true" >> "$GITHUB_OUTPUT"
              echo "exitcode=0" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          # The plan role is strictly read-only, which shapes both flags below.
          #
          # -lock=false: Terraform's S3 lock (use_lockfile) would make "read-only"
          # write a .tflock object and use the state CMK to do it. Plan mutates
          # nothing, so concurrent plans are harmless — dropping the lock buys a
          # role with no write permission at all. Deploy keeps locking.
          #
          # -refresh=false (workload only): this layer manages two in-cluster
          # resources (helm_release, kubernetes_service_account). Refreshing them
          # means calling the Kubernetes API, authorized by an EKS Access Entry
          # that the plan role deliberately does not have. Planning from stored
          # state keeps the role out of the cluster. Trade-off: drift in those two
          # resources will not show here; the deploy path's own refresh catches it
          # before anything is applied. See ARCHITECTURE.md §9.
          REFRESH_FLAG=""
          if [ "${{ matrix.layer }}" = "workload" ]; then
            REFRESH_FLAG="-refresh=false"
          fi

          terraform -chdir=${{ matrix.layer }} plan -no-color -input=false \
            -lock=false ${REFRESH_FLAG} \
            -var-file=environments/${{ env.ENV_NAME }}/terraform.tfvars \
            > /tmp/plan_output.txt 2>&1
          echo "exitcode=$?" >> "$GITHUB_OUTPUT"

      # On PRs: post/update the plan as a comment.
      - name: Comment plan on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const fs = require('fs');
            const layer = '${{ matrix.layer }}';
            const code = '${{ steps.plan.outputs.exitcode }}';
            const skipped = '${{ steps.plan.outputs.skipped }}' === 'true';
            const tag = `<!-- tf-plan-bot-${layer} -->`;
            let plan = fs.readFileSync('/tmp/plan_output.txt', 'utf8');
            // exit 0 = no changes, 2 = changes (both fine), 1 = error.
            const status = skipped ? '⏭️' : (code !== '1' ? '✅' : '❌');
            if (plan.length > 60000) plan = plan.slice(0, 60000) + '\n... (truncated)';
            const body = `${tag}\n## ${status} Terraform Plan — \`${layer}\` (${process.env.ENV_NAME})\n\n<details><summary>Show plan</summary>\n\n\`\`\`\n${plan}\n\`\`\`\n\n</details>`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes(tag));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo,
                comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: context.issue.number, body,
              });
            }

      # On manual dispatch: just surface the plan in the job log.
      - name: Show plan (dispatch)
        if: github.event_name == 'workflow_dispatch'
        run: cat /tmp/plan_output.txt

      - name: Fail on plan error
        if: steps.plan.outputs.exitcode == '1'
        run: |
          echo "terraform plan failed:" >&2
          cat /tmp/plan_output.txt >&2
          exit 1
