# Trivy as a pull-request gate. The steps live in _security-scan.yml, which the
# deploy workflow also calls — so the gate and the check cannot drift apart.
#
# They had drifted: this scan uploads SARIF and enforces separately, while the
# deploy's inline copy had neither. A gate weaker than the check it mirrors reports
# success for a test that was not run.
name: security-scan

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [master, develop, main]
    paths:
      - "**.tf"
      - "**.tfvars"
      - "**.hcl"
      - ".trivyignore"
      - ".github/workflows/security-scan.yml"
      - ".github/workflows/_security-scan.yml"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: security-scan-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    uses: ./.github/workflows/_security-scan.yml
