name: eks-upgrade-pr

# Step 1 of an EKS upgrade: prepare the change, apply nothing.
#
# Moves kubernetes_version and the six add-on pins together, in hml and prod, each
# pin set to the version EKS marks as default for the target release — the rule
# CLAUDE.md states ("version bumps travel together"), done by scripts/eks-upgrade.sh
# instead of by memory. The result is pushed to a branch and opened as a pull
# request, whose checks run as on any other.
#
# GitHub documents that events caused by GITHUB_TOKEN start no workflows, and this
# pull request was first opened as a draft for a person to mark ready. In practice
# its `opened` event has run every check, each time, attributed to whoever
# dispatched this workflow — and the ready_for_review event then started a second,
# duplicate set, which cancelled the first and left the pull request red. Should the
# checks ever not start, closing and reopening it starts them (`reopened`).
#
# Step 2 is eks-upgrade.yml, after the merge. ARCHITECTURE.md §13.
on:
  workflow_dispatch:
    inputs:
      target-version:
        description: "Kubernetes minor to move to — one above the current, e.g. 1.36"
        required: true
        type: string

permissions:
  contents: write # push the upgrade branch
  pull-requests: write # open the pull request
  id-token: write # OIDC

concurrency:
  group: eks-upgrade-pr
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    # The branch is cut from whatever ref this runs on; only master is a base worth
    # proposing an upgrade against.
    if: github.ref == 'refs/heads/master'
    env:
      # Through env, not interpolated into the script: a free-text input expanded
      # by ${{ }} becomes shell source.
      TARGET: ${{ inputs.target-version }}
    steps:
      - name: Checkout
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3

      # The read-only PLAN role. Resolving add-on versions and reading upgrade
      # insights are both reads; nothing here should be able to write to AWS.
      - name: Authenticate to AWS and install Terraform
        uses: gulinux86/ci-templates/.github/actions/aws-terraform-setup@5532dca25b120e3cf5c2396b72b9fb5c5eb3d64c # ci-templates@master, 2026-10-17 (PR #1)
        with:
          role: plan
          terraform-version: "1.16.6"
          plan-role-arn: ${{ secrets.HML_PLAN_ROLE_ARN }}

      # Each check's output is kept for the pull request body.
      - name: Rewrite the version pins
        run: |
          set -euo pipefail
          ./scripts/eks-upgrade.sh bump "$TARGET" | tee /tmp/bump

      # Blocking, and before anything is pushed: a version bump the platform cannot
      # run on is not worth a pull request. Karpenter, Istio, cert-manager and Argo CD
      # are checked against their own published matrices; components without one are
      # listed as unverified. Reads hml's platform repository — prod tracks the same
      # one, and eks-upgrade checks each environment again against what runs.
      - name: Every component supports the target
        run: |
          set -euo pipefail
          ./scripts/eks-upgrade.sh compat hml "$TARGET" | tee /tmp/compat

      # Advisory here: a missing cluster is a notice, and insight errors are shown
      # without failing the job. eks-upgrade.yml repeats the check and blocks on them.
      - name: Upgrade insights for the live hml cluster
        run: ./scripts/eks-upgrade.sh preflight hml --advisory 2>&1 | tee /tmp/preflight || true

      - name: Push the upgrade branch and open a pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "::notice::hml and prod are already on $TARGET; nothing to propose"
            exit 0
          fi

          BRANCH="upgrade/eks-$TARGET"
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null; then
            echo "::error::$BRANCH already exists — merge or delete it first"
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git commit -am "feat: upgrade EKS to $TARGET with matching add-on pins"
          git push origin "$BRANCH"

          {
            echo "Moves \`kubernetes_version\` and the six add-on pins to EKS $TARGET, in hml and prod."
            echo ""
            echo "Merge once the checks pass, then run **eks-upgrade** for \`hml\` — not"
            echo "terraform-deploy (ARCHITECTURE.md §13). If no check has started, close and"
            echo "reopen this pull request."
            echo ""
            echo "### Version pins"
            echo '```'
            cat /tmp/bump
            echo '```'
            echo "### Component compatibility"
            echo '```'
            cat /tmp/compat
            echo '```'
            echo "### Upgrade insights (hml)"
            echo '```'
            # The REGION=/CLUSTER=/TARGET= lines are for eks-upgrade's $GITHUB_ENV.
            grep -vE '^(REGION|CLUSTER|TARGET)=' /tmp/preflight || true
            echo '```'
          } >/tmp/body

          # Needs "Allow GitHub Actions to create and approve pull requests" in the
          # repository settings. Without it the branch is still pushed and the
          # summary carries the compare link instead.
          if PR_URL=$(gh pr create --base master --head "$BRANCH" \
              --title "feat: upgrade EKS to $TARGET" --body-file /tmp/body); then
            LINK="[Review the pull request]($PR_URL) and let the checks run."
          else
            PR_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/master...$BRANCH?expand=1"
            echo "::warning::could not open the pull request — enable \"Allow GitHub Actions to create and approve pull requests\" in Settings → Actions → General"
            LINK="[Open the pull request]($PR_URL) and let the checks run."
          fi

          {
            echo ""
            echo "### Next"
            echo ""
            echo "1. $LINK"
            echo "2. Merge, then run **eks-upgrade** for \`hml\`."
            echo "3. Once hml is verified, run **eks-upgrade** for \`prod\`."
          } >>"$GITHUB_STEP_SUMMARY"
          echo "::notice title=Upgrade pull request::$PR_URL"
