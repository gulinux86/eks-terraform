name: eks-upgrade-pr

# Step 1 of an EKS upgrade: prepare the change, apply nothing.
#
# Moves kubernetes_version and the six add-on pins together, in hml and prod, each
# pin set to the version EKS marks as default for the target release — the rule
# CLAUDE.md states ("version bumps travel together"), done by scripts/eks-upgrade.sh
# instead of by memory. The result is pushed to a branch; opening the pull request
# is left to a person, because a pull request opened with GITHUB_TOKEN triggers no
# workflows, and this change needs every check the repository has.
#
# Step 2 is eks-upgrade.yml, after the merge. ARCHITECTURE.md §13.
on:
  workflow_dispatch:
    inputs:
      target-version:
        description: "Kubernetes minor to move to — one above the current, e.g. 1.36"
        required: true
        type: string

permissions:
  contents: write # push the upgrade branch
  id-token: write # OIDC

concurrency:
  group: eks-upgrade-pr
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    # The branch is cut from whatever ref this runs on; only master is a base worth
    # proposing an upgrade against.
    if: github.ref == 'refs/heads/master'
    env:
      # Through env, not interpolated into the script: a free-text input expanded
      # by ${{ }} becomes shell source.
      TARGET: ${{ inputs.target-version }}
    steps:
      - name: Checkout
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3

      # The read-only PLAN role. Resolving add-on versions and reading upgrade
      # insights are both reads; nothing here should be able to write to AWS.
      - name: Authenticate to AWS and install Terraform
        uses: gulinux86/ci-templates/.github/actions/aws-terraform-setup@5532dca25b120e3cf5c2396b72b9fb5c5eb3d64c # ci-templates@master, 2026-10-17 (PR #1)
        with:
          role: plan
          terraform-version: "1.16.6"
          plan-role-arn: ${{ secrets.HML_PLAN_ROLE_ARN }}

      - name: Rewrite the version pins
        run: ./scripts/eks-upgrade.sh bump "$TARGET"

      # Blocking, and before anything is pushed: a version bump the platform cannot
      # run on is not worth a pull request. Karpenter, Istio, cert-manager and Argo CD
      # are checked against their own published matrices; components without one are
      # listed as unverified. Reads hml's platform repository — prod tracks the same
      # one, and eks-upgrade checks each environment again against what runs.
      - name: Every component supports the target
        run: ./scripts/eks-upgrade.sh compat hml "$TARGET"

      # Advisory here: a missing cluster is a notice, and insight errors are shown
      # without failing the job. eks-upgrade.yml repeats the check and blocks on them.
      - name: Upgrade insights for the live hml cluster
        run: ./scripts/eks-upgrade.sh preflight hml --advisory || true

      - name: Push the upgrade branch
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "::notice::hml and prod are already on $TARGET; nothing to propose"
            exit 0
          fi

          BRANCH="upgrade/eks-$TARGET"
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null; then
            echo "::error::$BRANCH already exists — merge or delete it first"
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git commit -am "feat: upgrade EKS to $TARGET with matching add-on pins"
          git push origin "$BRANCH"

          URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/master...$BRANCH?expand=1"
          {
            echo ""
            echo "### Next"
            echo ""
            echo "1. [Open the pull request]($URL) and let the checks run."
            echo "2. Merge, then run **eks-upgrade** for \`hml\`."
            echo "3. Once hml is verified, run **eks-upgrade** for \`prod\`."
          } >>"$GITHUB_STEP_SUMMARY"
          echo "open the pull request: $URL"
