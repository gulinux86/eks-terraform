name: terraform-deploy

# Manual, controlled deploys: you pick the environment and layer when you run it.
# Nothing applies automatically on merge. PROD is still gated by the `prod`
# GitHub Environment (required reviewer). Apply always uses a saved plan.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options: [hml, prod]
      layer:
        description: "Which layer(s) to apply"
        required: true
        default: both
        type: choice
        options: [foundation, workload, both]

permissions:
  contents: read
  id-token: write # OIDC

jobs:
  # Gate 1 — critical-module unit tests. Mocked providers (no AWS creds, no
  # infra), env/layer-agnostic, so they run the same for hml and prod on every
  # deploy. A failure blocks the apply.
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read # credential-free
    strategy:
      fail-fast: true
      matrix:
        module:
          - foundation/modules/network
          - foundation/modules/cluster
          - foundation/modules/eks-addons
          - workload/modules/platform-ingress
          - foundation/modules/karpenter
    steps:
      - name: Checkout
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "~> 1.10"

      - name: Terraform fmt
        run: terraform fmt -check -recursive ${{ matrix.module }}

      - name: Terraform test
        run: |
          terraform -chdir=${{ matrix.module }} init -input=false -backend=false
          terraform -chdir=${{ matrix.module }} test -no-color

  # Gate 1b — the foundation -> workload output contract. Credential-free.
  contract:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3

      - name: Check layer output contract
        run: ./scripts/check-layer-contract.sh

  # Gate 2 — Trivy IaC misconfiguration scan. Fails on HIGH/CRITICAL using the
  # committed .trivyignore. Same scan for hml and prod. No SARIF upload here
  # (that runs on PRs); this is a hard pre-apply gate.
  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3

      - name: Trivy config scan (gate)
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          format: table
          severity: HIGH,CRITICAL
          trivyignores: .trivyignore
          exit-code: "1"

  deploy:
    needs: [test, contract, security] # apply only after every gate passes
    runs-on: ubuntu-latest
    # Ties to the GitHub Environment: `prod` carries the required reviewer, so a
    # prod run pauses for approval before this job starts.
    environment: ${{ github.event.inputs.environment }}
    # Never run two applies for the same env at once; never cancel one mid-apply.
    concurrency:
      group: terraform-${{ github.event.inputs.environment }}
      cancel-in-progress: false
    env:
      ENVIRONMENT: ${{ github.event.inputs.environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3

      # Assumes the write-capable DEPLOY role. Reachable only because this job
      # declares `environment:` above, which is what makes GitHub stamp the
      # `environment:<name>` subject claim the role trusts. The Environment's
      # deployment-branch policy decides whether the job may start at all.
      - name: Select AWS role
        run: |
          if [ "$ENVIRONMENT" = "prod" ]; then
            echo "AWS_ROLE_ARN=${{ secrets.PROD_DEPLOY_ROLE_ARN }}" >> "$GITHUB_ENV"
          else
            echo "AWS_ROLE_ARN=${{ secrets.HML_DEPLOY_ROLE_ARN }}" >> "$GITHUB_ENV"
          fi

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b # v6.2.0
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "~> 1.10"

      - name: Resolve layers
        run: |
          # "both" must apply foundation BEFORE workload (workload reads its state).
          if [ "${{ github.event.inputs.layer }}" = "both" ]; then
            echo "LAYERS=foundation workload" >> "$GITHUB_ENV"
          else
            echo "LAYERS=${{ github.event.inputs.layer }}" >> "$GITHUB_ENV"
          fi

      - name: Apply (saved plan per layer)
        run: |
          set -euo pipefail
          for L in $LAYERS; do
            echo "::group::terraform $L ($ENVIRONMENT)"
            terraform -chdir="$L" init -input=false \
              -backend-config="environments/${ENVIRONMENT}/backend.hcl"
            # plan -out then apply the saved plan — never re-plan at apply time.
            terraform -chdir="$L" plan -input=false -out=tfplan \
              -var-file="environments/${ENVIRONMENT}/terraform.tfvars"
            terraform -chdir="$L" apply -input=false -auto-approve tfplan
            echo "::endgroup::"
          done

      # The bastion installs kubectl from an in-region bucket rather than AWS's
      # public amazon-eks bucket, which lives in us-west-2 — a gateway endpoint
      # cannot route there and the bastion has no internet, so the cross-region
      # fetch simply hung. The runner has internet, so it does the fetch once and
      # copies the binary in. Terraform owns the bucket; it does not own a 50 MB
      # binary, which would have to sit on disk at plan time.
      - name: Seed the bastion tooling bucket with kubectl
        if: contains(env.LAYERS, 'foundation')
        run: |
          set -euo pipefail
          BUCKET=$(terraform -chdir=foundation output -raw tooling_bucket)
          KVER=$(terraform -chdir=foundation output -raw kubectl_version)
          KEY="kubectl/$KVER/kubectl"

          if aws s3 ls "s3://$BUCKET/$KEY" >/dev/null 2>&1; then
            echo "already seeded: s3://$BUCKET/$KEY"
            exit 0
          fi

          # AWS publishes kubectl to a single bucket in us-west-2, under dated
          # builds. Discover the newest rather than hardcoding a date that rots.
          KDATE=$(aws s3 ls "s3://amazon-eks/$KVER/" --region us-west-2 \
            | awk '{print $2}' | tr -d / | sort | tail -1)
          [ -n "$KDATE" ] || { echo "no builds under s3://amazon-eks/$KVER/ — is $KVER a full x.y.z version?" >&2; exit 1; }
          echo "newest build for $KVER is $KDATE"

          aws s3 cp "s3://amazon-eks/$KVER/$KDATE/bin/linux/amd64/kubectl" /tmp/kubectl --region us-west-2
          chmod +x /tmp/kubectl
          /tmp/kubectl version --client
          aws s3 cp /tmp/kubectl "s3://$BUCKET/$KEY"
          echo "seeded s3://$BUCKET/$KEY"
