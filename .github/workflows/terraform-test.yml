# Native `terraform test` as a pull-request gate. The steps live in
# _terraform-test.yml, which the deploy workflow also calls.
#
# The module list is not here, and not there either: the reusable workflow derives it
# from whichever modules have a `tests/` directory. It used to be a hand-written
# matrix in this file AND in the deploy gate, with CLAUDE.md telling contributors to
# update both — and the two had already diverged.
name: terraform-test

on:
  pull_request:
    # ready_for_review too: eks-upgrade-pr opens its pull request as a draft with
    # GITHUB_TOKEN, which triggers nothing; marking it ready is what starts the checks.
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [master, develop, main]
    paths:
      - "**.tf"
      - "**.tftest.hcl"
      - ".github/workflows/terraform-test.yml"
      - ".github/workflows/_terraform-test.yml"
      - "scripts/check-layer-contract.sh"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tf-test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    uses: ./.github/workflows/_terraform-test.yml
    with:
      # The foundation -> workload output contract. A renamed output passes fmt,
      # validate, every suite and Trivy, and fails at run time in the layer that
      # reads it — see ARCHITECTURE.md §2.
      contract-script: ./scripts/check-layer-contract.sh
