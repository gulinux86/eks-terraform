name: terraform-test

# Native `terraform test` as a required PR gate. The suites use mocked providers
# (command = plan), so this job needs NO AWS credentials and creates NO real
# infrastructure — it runs on PRs from any branch/fork.
on:
  pull_request:
    branches: [master, develop, main]
    paths:
      - "**.tf"
      - "**.tftest.hcl"
      - ".github/workflows/terraform-test.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tf-test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # The foundation -> workload output contract. workload/ reads foundation outputs
  # through terraform_remote_state, a link that exists only at run time: renaming or
  # deleting an output passes fmt, validate, the module suites and Trivy, and fails
  # during a workload apply. Name-level check only — no credentials, no providers,
  # no state. See ARCHITECTURE.md §9.
  contract:
    runs-on: ubuntu-latest
    permissions:
      contents: read # credential-free
    steps:
      - name: Checkout
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3

      - name: Check layer output contract
        run: ./scripts/check-layer-contract.sh

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - foundation/modules/network
          - foundation/modules/cluster
          - foundation/modules/eks-addons
          - workload/modules/platform-ingress
          - foundation/modules/karpenter
    steps:
      - name: Checkout
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "~> 1.10"

      - name: Terraform fmt
        run: terraform fmt -check -recursive ${{ matrix.module }}

      - name: Terraform init
        run: terraform -chdir=${{ matrix.module }} init -input=false -backend=false

      - name: Terraform test
        run: terraform -chdir=${{ matrix.module }} test -no-color
