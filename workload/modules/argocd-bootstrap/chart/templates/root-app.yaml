# The root Application — the only one Terraform applies.
#
# It watches apps/ in the platform repository. Every component is an Application in
# that directory, so adding one to the cluster becomes adding a file and committing:
# Argo CD reconciles the rest. This is the whole point of app-of-apps, and the
# reason Terraform's involvement ends here.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: {{ .Release.Namespace }}
  # No resources-finalizer here, deliberately — and the earlier comment claiming
  # it prevented cascade had it backwards: the finalizer is what *causes* one.
  #
  # The root Application is only ever deleted when the whole layer is torn down,
  # and the cluster goes with it. Making Kubernetes block on Argo CD cascading
  # through every child and its resources first is pure waste, and it deadlocks
  # outright if the controller is being removed in the same operation: the
  # finalizer waits for a controller that is no longer there.
  #
  # Component removal still works, and through the right mechanism: deleting a
  # file from apps/ makes the root prune that child.
spec:
  project: platform

  source:
    repoURL: {{ .Values.platformRepoUrl | quote }}
    targetRevision: {{ .Values.platformRepoRevision | quote }}
    path: apps
    directory:
      # apps/ holds Applications only. Recursing would pull in components/ as raw
      # manifests and apply them twice — once here and once through their own
      # Application.
      recurse: false

  destination:
    server: https://kubernetes.default.svc
    namespace: {{ .Release.Namespace }}

  syncPolicy:
    automated:
      # prune removes children whose file was deleted; selfHeal reverts manual
      # kubectl edits. Together they make Git the only way to change the cluster —
      # which is the property GitOps is actually for.
      prune: true
      selfHeal: true
    syncOptions:
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
