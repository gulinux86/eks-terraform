# The root Application — the only one Terraform applies.
#
# It watches apps/ in the platform repository. Every component is an Application in
# that directory, so adding one to the cluster becomes adding a file and committing:
# Argo CD reconciles the rest. This is the whole point of app-of-apps, and the
# reason Terraform's involvement ends here.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: {{ .Release.Namespace }}
  # The finalizer makes deletion cascade: removing the root tells Argo CD to
  # delete every child Application and the resources they own.
  #
  # This was briefly removed after a destroy hung on it, which treated the symptom.
  # The cascade is exactly what is needed — it is what deletes the Istio Gateway,
  # and therefore its Service, while the load-balancer controller is still alive to
  # remove the NLB. Without it Terraform tears the cluster down first and the NLB
  # is orphaned, holding the subnets and failing the destroy.
  #
  # What was actually missing is ordering: nothing guaranteed the cascade finished
  # before Argo CD itself was uninstalled, so the finalizer waited on a controller
  # that was already gone. The pre-destroy step in terraform-destroy.yml supplies
  # that guarantee. The two only work as a pair.
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform

  source:
    repoURL: {{ .Values.platformRepoUrl | quote }}
    targetRevision: {{ .Values.platformRepoRevision | quote }}
    path: apps
    directory:
      # apps/ holds Applications only. Recursing would pull in components/ as raw
      # manifests and apply them twice — once here and once through their own
      # Application.
      recurse: false

  destination:
    server: https://kubernetes.default.svc
    namespace: {{ .Release.Namespace }}

  syncPolicy:
    automated:
      # prune removes children whose file was deleted; selfHeal reverts manual
      # kubectl edits. Together they make Git the only way to change the cluster —
      # which is the property GitOps is actually for.
      prune: true
      selfHeal: true
    syncOptions:
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
